# Cloudflare Worker 配置 —— 变量版
# 部署：npx wrangler deploy
# 本地调试：npx wrangler dev
#
# 提示词不写在这个文件里。
# 两个来源，二选一：
#   1. 命令行注入（推荐）：
#        node set-prompt.mjs prompt.txt
#      会生成 wrangler.local.toml（含提示词，已被 .gitignore 忽略）
#      然后 npx wrangler deploy -c wrangler.local.toml
#   2. Dashboard → Settings → Variables and Secrets → 加 PROMPT
#
# 两处都没有 = 不注入，只做 UA 伪装。

name = "ua-proxy"
main = "src/agentrouter-3-env.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

[vars]
UA = "claude-cli/2.0.0 (external, cli)"
UPSTREAM = "https://api.xingchiapi.com"
MODE = "append"

# 提示词留空占位。想直接写在这里也可以，把下面这行改成：
#   PROMPT = '''
#   你的提示词原文
#   '''
# 注意 ''' 是字面多行字符串，内部不解析转义。
# 但这样提示词会进版本库，不推荐。
PROMPT = ""
