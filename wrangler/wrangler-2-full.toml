# Cloudflare Worker 配置 —— 提示词内嵌版
# 部署：npx wrangler deploy
# 本地调试：npx wrangler dev
#
# 提示词已写死在 agentrouter-2-full.js 的 PROMPT 常量里，这里不用设。
# 要改提示词就改那个 js 文件。

name = "ua-proxy"
main = "src/agentrouter-2-full.js"
compatibility_date = "2024-11-01"

[vars]
UA = "claude-cli/2.0.0 (external, cli)"
UPSTREAM = "https://api.xingchiapi.com"
MODE = "append"

[observability]
enabled = true
